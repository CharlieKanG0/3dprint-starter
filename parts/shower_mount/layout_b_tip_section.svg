<text x="-36.48" y="39.74" font-size="1.64" font-family="Helvetica, Arial, sans-serif" fill="#444">24 teeth (every 15 deg), height 1.1. Fine for FDM; if they print mushy, drop to 18 teeth (20 deg).</text>
<text x="-36.48" y="42.35" font-size="1.64" font-family="Helvetica, Arial, sans-serif" fill="#444">Holds: 60 N spring -&gt; slip 0.95 Nm vs handset 0.19 Nm (38 mm offset): factor 5.</text>
<text x="-36.48" y="44.97" font-size="1.64" font-family="Helvetica, Arial, sans-serif" fill="#444">  A hose tug of ~9 N at the hose fitting (~100 mm below) re-aims it, by design.</text>
<text x="-36.48" y="47.59" font-size="1.64" font-family="Helvetica, Arial, sans-serif" fill="#444">Spring sits in a pocket in the arm tip; the thumb cap's spigot slides in the pocket, so it is always covered.</text>
<text x="-36.48" y="50.21" font-size="1.64" font-family="Helvetica, Arial, sans-serif" fill="#444">ASSUMED: spring 8 OD x 12 long, 60 N; handset 0.5 kg.</text>
