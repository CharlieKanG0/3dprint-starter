<text x="-42.27" y="185.42" font-size="7.64" font-family="Helvetica, Arial, sans-serif" fill="#444">Hinge -&gt; tip 257-370 (113 travel). Reach out from the rail face 305-418 at 0 deg;</text>
<text x="-42.27" y="197.64" font-size="7.64" font-family="Helvetica, Arial, sans-serif" fill="#444">  drop at the 45 deg stop 182-262. Was one fixed length, 354.</text>
<text x="-42.27" y="209.85" font-size="7.64" font-family="Helvetica, Arial, sans-serif" fill="#444">Sections: sleeve 34x24 outside, 4 wall; bar 25.4x15.4, 0.3 sliding clearance per side.</text>
<text x="-42.27" y="222.07" font-size="7.64" font-family="Helvetica, Arial, sans-serif" fill="#444">Both pieces under 256 so they print flat, teeth up -- no split joint, no lap bolts.</text>
<text x="-42.27" y="234.29" font-size="7.64" font-family="Helvetica, Arial, sans-serif" fill="#444">Rectangular bar: can't twist in the sleeve, so the tip joint stays aligned with the hinge.</text>
