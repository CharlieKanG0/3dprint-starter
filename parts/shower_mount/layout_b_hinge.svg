<text x="-64.64" y="80.23" font-size="2.73" font-family="Helvetica, Arial, sans-serif" fill="#444">40 teeth, 90 deg included, height 1.57 at mean radius 20 (printed facing up, no supports).</text>
<text x="-64.64" y="84.59" font-size="2.73" font-family="Helvetica, Arial, sans-serif" fill="#444">Holds: slip torque = F r tan(flank + atan mu) = 150 N x 0.020 m x tan(45+17) = 5.6 Nm</text>
<text x="-64.64" y="88.95" font-size="2.73" font-family="Helvetica, Arial, sans-serif" fill="#444">  vs gravity 2.1 Nm (0.6 kg at 354 mm) -&gt; safety factor 2.7.</text>
<text x="-64.64" y="93.32" font-size="2.73" font-family="Helvetica, Arial, sans-serif" fill="#444">Adjust by hand: ~10 N to push down, ~22 N to lift, at the tip.</text>
<text x="-64.64" y="97.68" font-size="2.73" font-family="Helvetica, Arial, sans-serif" fill="#444">ASSUMED: spring 150 N at 20 N/mm, mu 0.3, carried mass 0.6 kg. Knob tightens hard for driving.</text>
<text x="-64.64" y="102.05" font-size="2.73" font-family="Helvetica, Arial, sans-serif" fill="#444">Spring enclosed: 8 mm deep pocket in the hub + 15 mm boss, covered by the knob's skirt (9 mm overlap).</text>
<text x="-64.64" y="106.41" font-size="2.73" font-family="Helvetica, Arial, sans-serif" fill="#444">Knob range: 4.4 mm in (+89 N) before the rim meets the hub, 9 mm out (-180 N) before the boss shows.</text>
<text x="-64.64" y="110.77" font-size="2.73" font-family="Helvetica, Arial, sans-serif" fill="#444">Shower water gets in past the skirt: the annulus is open at the bottom so it drains; stainless spring + washer.</text>
