<text x="-40.20" y="88.00" font-size="4.00" font-family="Helvetica, Arial, sans-serif" fill="#444">A thumb knob (stepless): M6 brass insert in the sleeve top, a printed thumb screw pushes a shoe onto the bar.</text>
<text x="-40.20" y="94.40" font-size="4.00" font-family="Helvetica, Arial, sans-serif" fill="#444">  Any length, holds hard, one hand. Loosen, slide, tighten. Simplest and strongest.</text>
<text x="-40.20" y="100.80" font-size="4.00" font-family="Helvetica, Arial, sans-serif" fill="#444">B click detent (stepped, every ~15 mm): a flexing tab in the sleeve wall drops into notches along the bar.</text>
<text x="-40.20" y="107.20" font-size="4.00" font-family="Helvetica, Arial, sans-serif" fill="#444">  Pull/push to click, no knob -- same feel as the hinge. Holds less; a hard tug can click it in.</text>
<text x="-40.20" y="113.60" font-size="4.00" font-family="Helvetica, Arial, sans-serif" fill="#444">C twist collar (tripod-leg style): threaded collar squeezes a slotted sleeve mouth. Stepless, but a</text>
<text x="-40.20" y="120.00" font-size="4.00" font-family="Helvetica, Arial, sans-serif" fill="#444">  bulky printed thread at the arm tip, and the slotted mouth is the weakest place in ASA.</text>
</svg>